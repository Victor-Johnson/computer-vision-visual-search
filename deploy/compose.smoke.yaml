# Optional local reverse-proxy verification, never required in production.
services:
  proxy-smoke:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:18501:80"
    volumes:
      - ./tests/nginx-smoke.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
